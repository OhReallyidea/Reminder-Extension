<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Follow-Up Due</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }


    body {

      min-height: 100vh;

      background:
        linear-gradient(
          145deg,
          #eff6ff,
          #f8fafc
        );

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      color: #0f172a;

    }


    .alert-card {

      width: 100%;

      max-width: 380px;

      background: white;

      border-radius: 20px;

      padding: 25px;

      text-align: center;

      box-shadow:
        0 20px 60px
        rgba(15, 23, 42, .18);

      border:
        1px solid #e2e8f0;

      animation:
        popup .35s ease;

    }


    @keyframes popup {

      from {

        opacity: 0;

        transform:
          scale(.90)
          translateY(15px);

      }

      to {

        opacity: 1;

        transform:
          scale(1)
          translateY(0);

      }

    }


    .bell {

      width: 70px;

      height: 70px;

      margin:
        0 auto 15px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #fff7ed;

      border-radius: 20px;

      font-size: 34px;

      animation:
        ring .8s infinite;

    }


    @keyframes ring {

      0% {
        transform: rotate(0);
      }

      20% {
        transform: rotate(8deg);
      }

      40% {
        transform: rotate(-8deg);
      }

      60% {
        transform: rotate(5deg);
      }

      80% {
        transform: rotate(-5deg);
      }

      100% {
        transform: rotate(0);
      }

    }


    .label {

      color: #ea580c;

      font-size: 11px;

      font-weight: 800;

      letter-spacing: 1.2px;

    }


    h1 {

      margin-top: 7px;

      font-size: 24px;

      font-weight: 800;

    }


    .priority {

      display: inline-block;

      margin-top: 9px;

      padding: 5px 10px;

      background: #fff1f2;

      color: #be123c;

      border-radius: 7px;

      font-size: 10px;

      font-weight: 800;

    }


    .details {

      margin-top: 20px;

      padding: 14px;

      text-align: left;

      background: #f8fafc;

      border-radius: 12px;

    }


    .detail {

      display: flex;

      gap: 9px;

      padding: 7px 0;

      color: #475569;

      font-size: 12px;

    }


    .detail + .detail {

      border-top:
        1px solid #e2e8f0;

    }


    .note {

      line-height: 1.5;

    }


    .actions {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-top: 18px;

    }


    button {

      border: 0;

      border-radius: 9px;

      padding: 11px 8px;

      font-size: 11px;

      font-weight: 750;

      cursor: pointer;

      transition: .2s;

    }


    button:hover {

      transform:
        translateY(-1px);

    }


    .call {

      background: #dcfce7;

      color: #15803d;

    }


    .whatsapp {

      background: #dcfce7;

      color: #166534;

    }


    .done {

      background: #2563eb;

      color: white;

      grid-column: 1 / -1;

    }


    .snooze {

      background: #f1f5f9;

      color: #475569;

      grid-column: 1 / -1;

    }


    .close {

      margin-top: 13px;

      background: transparent;

      color: #94a3b8;

      font-size: 10px;

    }


  </style>

</head>


<body>


  <main class="alert-card">


    <div class="bell">
      🔔
    </div>


    <div class="label">
      FOLLOW-UP DEADLINE
    </div>


    <h1 id="merchantName">
      Merchant
    </h1>


    <span
      id="priority"
      class="priority">
      🔥 HOT
    </span>


    <div class="details">


      <div class="detail">

        <span>📞</span>

        <strong id="phone">
          -
        </strong>

      </div>


      <div class="detail">

        <span>⏰</span>

        <strong id="deadline">
          Due now
        </strong>

      </div>


      <div class="detail note">

        <span>📝</span>

        <span id="note">
          Follow-up is due now.
        </span>

      </div>


    </div>


    <div class="actions">


      <button
        id="callBtn"
        class="call">

        📞 Call Merchant

      </button>


      <button
        id="whatsappBtn"
        class="whatsapp">

        💬 WhatsApp

      </button>


      <button
        id="doneBtn"
        class="done">

        ✓ Mark as Completed

      </button>


      <button
        id="snoozeBtn"
        class="snooze">

        💤 Snooze 15 Minutes

      </button>


    </div>


    <button
      id="closeBtn"
      class="close">

      Close

    </button>


  </main>


  <audio
    id="alertSound"
    src="alert.mp3"
    preload="auto">
  </audio>


  <script src="alert.js"></script>

</body>

</html>
